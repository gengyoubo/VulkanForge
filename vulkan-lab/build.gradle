plugins { id 'java'; id 'application' }
group = 'dev.vulkanforge'
version = '0.1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main.java.srcDir '../bridge-protocol/src/main/java'
sourceSets.main.java.srcDir '../gl-interop/src/main/java'
sourceSets.test.java.srcDir '../benchmark-support/src/main/java'
repositories { mavenCentral() }

def lwjglVersion = '3.3.6'
dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-vulkan', 'lwjgl-shaderc'].each {
        implementation "org.lwjgl:${it}"
    }
    // Stage 1 supports Windows/Linux x86_64. Vulkan loader comes from the GPU driver.
    ['natives-windows', 'natives-linux'].each { platform ->
        ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-shaderc'].each {
            runtimeOnly "org.lwjgl:${it}::${platform}"
        }
    }
}
application { mainClass = 'github.com.gengyoubo.vulkanforge.lab.LabMain' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(JavaExec).configureEach {
    if (rootProject.hasProperty('vulkan13Smoke')) systemProperty 'vulkanforge.vulkanVersion', '1.3'
    if (rootProject.hasProperty('vulkanVersion')) systemProperty 'vulkanforge.vulkanVersion', rootProject.property('vulkanVersion')
    // e.g. -PnvidiaExtensions=VK_NV_mesh_shader: same comma list the config screen hands the backend.
    if (rootProject.hasProperty('nvidiaExtensions')) systemProperty 'vulkanforge.nvidiaExtensions', rootProject.property('nvidiaExtensions')
}
tasks.register('fatJar', Jar) {
    archiveFileName = 'vulkan-lab.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass.get() }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
}
// OpenGL 4.6 backend shaders live with the mod; compile them to GL SPIR-V here, where shaderc is on the classpath.
tasks.register('glSpirv', JavaExec) {
    def sources = file('../src/main/resources/assets/vulkanforge/shaders/gl46')
    def output = layout.buildDirectory.dir('generated/gl46-spirv')
    inputs.dir sources
    outputs.dir output
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.lab.GlSpirvCompiler'
    args sources.absolutePath, output.get().asFile.absolutePath
}
tasks.register('runProbe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args '--probe'
}
tasks.register('runTriangle', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args '--triangle'
}
// Explicit GPU integration check; ordinary build remains usable on machines without Vulkan.
tasks.register('smokeBridge', JavaExec) {
    dependsOn 'fatJar', 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.vulkanforge.lab.BridgeSmokeTest'
    args tasks.named('fatJar', Jar).get().archiveFile.get().asFile.absolutePath
}
tasks.register('smokeWorld', JavaExec) {
    dependsOn 'fatJar', 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.vulkanforge.lab.WorldSmokeTest'
    args tasks.named('fatJar', Jar).get().archiveFile.get().asFile.absolutePath
}

tasks.register('smokePresent', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.lab.NativePresentSmoke'
    // e.g. -Pvulkanforge.asyncAcquire=always exercises the off-thread acquire through cancellation, resize and recovery.
    rootProject.properties.findAll { it.key.startsWith('vulkanforge.') }.each { systemProperty it.key, it.value }
    if (rootProject.hasProperty('validationSmoke')) systemProperty 'vulkanforge.requireValidation', 'true'
    if (rootProject.hasProperty('pushDescriptorSmoke')) systemProperty 'vulkanforge.preferPushDescriptors', 'true'
    if (rootProject.hasProperty('legacyGpuSmoke')) {
        systemProperty 'vulkanforge.disableGpuDriven', 'true'
        systemProperty 'vulkanforge.disableUploadTimeline', 'true'
        systemProperty 'vulkanforge.disablePushDescriptors', 'true'
    }
}

tasks.register('smokeResources', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.lab.ResourceSmoke'
    if (rootProject.hasProperty('validationSmoke')) systemProperty 'vulkanforge.requireValidation', 'true'
}

['1.2', '1.3', '1.4'].each { api ->
    def checks = []
    ['World', 'Bridge', 'Resources', 'Shared'].each { check ->
        def taskName = 'smokeVk' + api.replace('.', '') + check
        checks.add(taskName)
        tasks.register(taskName, JavaExec) {
            dependsOn 'fatJar', 'testClasses'
            classpath = sourceSets.test.runtimeClasspath
            mainClass = check == 'Shared' ? 'github.com.gengyoubo.vulkanforge.lab.SharedOffscreenSmoke' : check == 'Resources' ? 'github.com.gengyoubo.vulkanforge.lab.ResourceSmoke' : 'dev.vulkanforge.lab.' + check + 'SmokeTest'
            if (check in ['World', 'Bridge']) args tasks.named('fatJar', Jar).get().archiveFile.get().asFile.absolutePath
            systemProperty 'vulkanforge.vulkanVersion', api
            def reports = rootProject.file('build/reports/offscreen-versions/vk-' + api)
            systemProperty 'vulkanforge.smokeReportDir', reports.absolutePath
            def captured = new ByteArrayOutputStream()
            standardOutput = captured
            errorOutput = captured
            ignoreExitValue = true
            doFirst {
                reports.mkdirs(); captured.reset()
                new File(reports, check.toLowerCase() + '-result.txt').text = 'STATUS=RUNNING\n'
            }
            doLast {
                def output = captured.toString('UTF-8')
                def successful = executionResult.get().exitValue == 0
                new File(reports, check.toLowerCase() + '-result.txt').text = output + (successful ? '\nSTATUS=OK\n' : '\nSTATUS=FAILED\n')
                if (!successful) throw new GradleException('Vulkan ' + api + ' offscreen ' + check + ' failed; see ' + reports)
                logger.lifecycle('Vulkan ' + api + ' offscreen ' + check + ': OK')
            }
        }
    }
    tasks.register('smokeVk' + api.replace('.', '')) { dependsOn checks }
}
tasks.register('smokeVulkanOffscreen') { dependsOn 'smokeVk12', 'smokeVk13', 'smokeVk14' }

tasks.register('benchmarkBindings', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.lab.BindingBenchmark'
    systemProperty 'vulkanforge.disableValidation', 'true'
}

tasks.register('benchmarkPresent', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.lab.PresentBenchmark'
    systemProperty 'vulkanforge.disableValidation', 'true'
    // -Pbench.fullscreen=true -Pbench.frames=3000 ... are forwarded as system properties.
    rootProject.properties.findAll { it.key.startsWith('bench.') || it.key.startsWith('vulkanforge.') }.each { systemProperty it.key, it.value }
}

// Same terrain path as the game without surface/swapchain/present: -Pbench.frames=3000 -Pbench.width=1920 -Pbench.radius=12 ...
tasks.register('benchmarkOffscreen', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.lab.OffscreenBenchmark'
    systemProperty 'vulkanforge.disableValidation', 'true'
    rootProject.properties.findAll { it.key.startsWith('bench.') || it.key.startsWith('vulkanforge.') }.each { systemProperty it.key, it.value }
}

tasks.register('exportBenchmarkScene', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.lab.BenchmarkSceneExport'
    args rootProject.file('build/reports/offscreen-performance/scene.bin').absolutePath
    rootProject.properties.findAll { it.key.startsWith('bench.') }.each { systemProperty it.key, it.value }
}

// For trace/capture-present-trace.ps1, which runs elevated (WPR) and must not run Gradle there: java @build/trace/bench.args ...
tasks.register('traceArgs') {
    dependsOn 'testClasses'
    def args = layout.buildDirectory.file('trace/bench.args')
    outputs.file args
    doLast {
        def file = args.get().asFile; file.parentFile.mkdirs()
        file.text = '-cp "' + sourceSets.test.runtimeClasspath.asPath.replace(File.separator, '/') + '"\n-Dvulkanforge.disableValidation=true\n'
    }
}
