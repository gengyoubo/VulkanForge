if (project.hasProperty('configSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def report = file('run/logs/vulkanforge/config-smoke.txt')
            report.parentFile.mkdirs(); report.text = 'STATUS=RUNNING\n'
        }
        doLast {
            def report = file('run/logs/vulkanforge/config-smoke.txt')
            if (!report.exists() || !report.text.contains('STATUS=OK')) throw new GradleException('Config screen smoke failed; see ' + report)
            if (report.text.contains('PASS config-only GL_TAIL startup')) {
                def backend = file('run/logs/vulkanforge/main-window-report.txt')
                if (!backend.text.contains('HYBRID_EXECUTION_PLAN=GL_TAIL') || !backend.text.contains('FINAL_PRESENTED_FRAMES=0'))
                    throw new GradleException('Saved plan did not select GL tail or close correctly')
                def snapshot = file('build/reports/render-mode-config/config-tail-backend.txt')
                snapshot.parentFile.mkdirs(); snapshot.bytes = backend.bytes
            }
        }
    }
}

