plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main.java.srcDir 'bridge-protocol/src/main/java'
sourceSets.main.java.srcDir 'gl-interop/src/main/java'
sourceSets {
    nativeBootstrap { }
    nativeBootstrapTest {
        compileClasspath += sourceSets.nativeBootstrap.output + sourceSets.nativeBootstrap.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    smoke {
        java.srcDir 'benchmark-support/src/main/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { vulkanforge { source sourceSets.main } }
        }
        client {
            // The agent reads the saved mode before Forge; it stays inert for GL/GL_VK.
            jvmArg '-javaagent:' + project.file('build/libs/vulkanforge-native-bootstrap.jar').absolutePath
            if (!project.hasProperty('nativeGame') && System.getProperty('vulkanforge.startup') != null)
                property 'vulkanforge.startup', System.getProperty('vulkanforge.startup')
            if (project.hasProperty('nativeGame')) {
                workingDirectory project.file('run-native')
                property 'vulkanforge.startup', 'VK:' + (project.findProperty('nativeApi') ?: 'V1_4')
            }
            if (project.hasProperty('nativeGameSmoke')) {
                property 'vulkanforge.nativeGameSmoke', 'true'
                if (project.hasProperty('nativeMenuOnly')) property 'vulkanforge.nativeMenuOnly', 'true'
                mods { vulkanforge { source sourceSets.smoke } }
            }
            ['vulkanforge.entityProfile', 'vulkanforge.entityLegacyBatch', 'vulkanforge.noInteropOptimizations', 'vulkanforge.earlyGlInputFlush', 'vulkanforge.glTailCompatibility'].each { key ->
                if (System.getProperty(key) != null) property key, System.getProperty(key)
            }
            ['tailProfile','tailProfileCpuOnly','glTailDiagnostics','glTailCase','interopProfile'].each { option ->
                def key = 'vulkanforge.' + option
                if (System.getProperty(key) != null) property key, System.getProperty(key)
            }
            if (project.hasProperty('tailAblation')) {
                property 'vulkanforge.tailAblation', 'true'
                if (!project.hasProperty('glTailFromConfig')) property 'vulkanforge.glTailCompatibility', 'true'
                property 'vulkanforge.glTailDiagnostics', 'true'
                property 'vulkanforge.tailProfile', 'true'
                property 'vulkanforge.interopProfile', 'true'
                if (!project.hasProperty('glTailFromConfig')) property 'vulkanforge.startup', 'GL_VK:V1_4'
                ['rounds','seconds','warmup','cases','phases'].each { option ->
                    def key = 'tailBench.' + option
                    if (project.hasProperty(key)) property key, project.property(key)
                }
                property 'tailBench.output', rootProject.file(project.findProperty('tailBench.output') ?: 'build/reports/tail-game-ablation').absolutePath
                property 'vulkanforge.tailProfileCpuOnly', project.findProperty('tailBench.cpuOnly') ?: 'false'
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if (project.hasProperty('vulkan13Smoke')) property 'vulkanforge.startup', 'VULKAN:V1_3'
            property 'vulkanforge.directPresent', System.getProperty('vulkanforge.directPresent', 'true')
            property 'vulkanforge.legacyPresent', System.getProperty('vulkanforge.legacyPresent', 'false')
            ['counterInterval', 'skipEmptyLayers', 'diffState'].each { option ->
                def key = 'vulkanforge.gl46.' + option
                if (System.getProperty(key) != null) property key, System.getProperty(key)
            }
            if (project.hasProperty('validationSmoke')) property 'vulkanforge.requireValidation', 'true'
            if (project.hasProperty('pushDescriptorSmoke')) property 'vulkanforge.preferPushDescriptors', 'true'
            if (project.hasProperty('configSmoke')) {
                property 'vulkanforge.configSmoke', 'true'
                if (project.hasProperty('restartClientSmoke')) property 'vulkanforge.restartClientSmoke', 'true'
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if (project.hasProperty('worldSmoke')) {
                property 'vulkanforge.worldSmoke', 'true'
                // This regression specifically checks the original Vulkan swapchain execution plan.
                property 'vulkanforge.glTailCompatibility', 'false'
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if (project.hasProperty('glTailSmoke')) {
                property 'vulkanforge.glTailSmoke', 'true'
                if (!project.hasProperty('glTailFromConfig')) {
                    property 'vulkanforge.glTailCompatibility', 'true'
                    property 'vulkanforge.startup', 'GL_VK:V1_4'
                }
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if (project.hasProperty('glTailFromConfig')) property 'vulkanforge.glTailFromConfig', 'true'
            if (project.hasProperty('gl46Smoke') || project.hasProperty('gl46Move')) {
                // -Pgl46Smoke: feature/parity check in a flat world; -Pgl46Move: fast flight through a generated world.
                property(project.hasProperty('gl46Move') ? 'vulkanforge.gl46Move' : 'vulkanforge.gl46Smoke', 'true')
                property 'vulkanforge.startup', 'OPENGL:GL_4_6'
                // -Pgl46Verify: compare every cached GL state snapshot with glGet (correctness run; timings are not representative).
                if (project.hasProperty('gl46Verify')) property 'vulkanforge.gl46.verifyState', 'true'
                // -Pgl46Flags=glsl,noHiZ,noBlockEntityCache,noVanillaVisibility,noEntities: A/B switches (vulkanforge.gl46.<flag>=true).
                if (project.hasProperty('gl46Flags')) project.property('gl46Flags').toString().split(',').each { if (it.trim()) property "vulkanforge.gl46.${it.trim()}", 'true' }
                mods { vulkanforge { source sourceSets.smoke } }
            }
        }
        server { args '--nogui' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    nativeBootstrapImplementation 'org.ow2.asm:asm-tree:9.5'
}

tasks.register('nativeBootstrapJar', Jar) {
    dependsOn 'nativeBootstrapClasses'
    archiveFileName = 'vulkanforge-native-bootstrap.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.nativeBootstrap.output
    from { configurations.nativeBootstrapRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    manifest { attributes 'Premain-Class': 'dev.vulkanforge.bootstrap.NativeBootstrap' }
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
}
tasks.register('smokeNativeBootstrap', JavaExec) {
    dependsOn 'nativeBootstrapTestClasses'
    classpath = sourceSets.nativeBootstrapTest.runtimeClasspath
    mainClass = 'dev.vulkanforge.bootstrap.NativeBootstrapSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.named('assemble') { dependsOn 'nativeBootstrapJar' }
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'nativeBootstrapJar' }
if (project.hasProperty('nativeGame') || project.hasProperty('nativeGameSmoke')) tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'nativeBootstrapJar'
    doFirst {
        def directory=file(project.hasProperty('nativeGame') ? 'run-native' : 'run'); directory.mkdirs()
        if (project.hasProperty('nativeGameSmoke')) {
            if (project.hasProperty('nativeGame')) new File(directory,'options.txt').text='renderDistance:3\nsimulationDistance:5\nguiScale:2\nmaxFps:60\nenableVsync:false\nonboardAccessibility:false\n'
            def result=new File(directory,'logs/vulkanforge/native-game-smoke/result.txt');result.parentFile.mkdirs();result.text='STATUS=RUNNING\n'
        }
    }
    doLast {
        if (project.hasProperty('nativeGameSmoke')) {
            def directory=file(project.hasProperty('nativeGame') ? 'run-native' : 'run')
            def result=new File(directory,'logs/vulkanforge/native-game-smoke/result.txt')
            if (!result.exists() || !result.text.contains('STATUS=OK')) throw new GradleException('Native game smoke failed; see ' + directory)
            def backend=new File(directory,'logs/vulkanforge/native-game-report.txt')
            if(!backend.exists() || !backend.text.contains('CLOSED=true') || !backend.text.contains('VALIDATION_ERRORS=0')) throw new GradleException('Native backend did not finish cleanly; see ' + backend)
            if(project.hasProperty('validationSmoke') && !backend.text.contains('VALIDATION=ENABLED')) throw new GradleException('Native validation layer was not enabled')
        }
    }
}

// The lab's LWJGL and native libraries are deliberately outside Minecraft's classpath.
evaluationDependsOn(':vulkan-lab')
def labJar = project(':vulkan-lab').tasks.named('fatJar')
tasks.named('processResources', ProcessResources) {
    dependsOn labJar
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
    from(labJar) { into 'vulkanforge'; rename { 'vulkan-lab.jar' } }
    from(project(':vulkan-lab').tasks.named('glSpirv')) { into 'assets/vulkanforge/shaders/gl46' }
}
tasks.named('jar', Jar) {
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('runProbe') { dependsOn ':vulkan-lab:runProbe' }
tasks.register('runTriangle') { dependsOn ':vulkan-lab:runTriangle' }

tasks.register('restartSmoke', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = files(sourceSets.main.output.classesDirs, sourceSets.smoke.output.classesDirs,
            configurations.runtimeClasspath.filter { it.name.startsWith('jna-') })
    mainClass = 'github.com.gengyoubo.vulkanforge.client.GameRestartSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.register('smokeRenderModeConfig', JavaExec) {
    dependsOn 'compileSmokeJava', 'processResources'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.config.RenderModeConfigSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.register('smokeNativeModeGate', JavaExec) {
    dependsOn 'compileSmokeJava'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.client.NativeModeGateSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.register('smokeLargeTextureCapture', JavaExec) {
    dependsOn 'compileSmokeJava', 'processResources'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.client.LargeTextureCaptureSmoke'
    maxHeapSize = '2g'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    systemProperty 'log4j.configurationFile', file('src/smoke/resources/offscreen-log4j2.xml').absolutePath
}
if (project.hasProperty('configSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def report = file('run/logs/vulkanforge/config-smoke.txt')
            report.parentFile.mkdirs(); report.text = 'STATUS=RUNNING\n'
        }
        doLast {
            def report = file('run/logs/vulkanforge/config-smoke.txt')
            if (!report.exists() || !report.text.contains('STATUS=OK')) throw new GradleException('Config screen smoke failed; see ' + report)
            if (report.text.contains('PASS config-only GL_TAIL startup')) {
                def backend = file('run/logs/vulkanforge/main-window-report.txt')
                if (!backend.text.contains('HYBRID_EXECUTION_PLAN=GL_TAIL') || !backend.text.contains('FINAL_PRESENTED_FRAMES=0'))
                    throw new GradleException('Saved plan did not select GL tail or close correctly')
                def snapshot = file('build/reports/render-mode-config/config-tail-backend.txt')
                snapshot.parentFile.mkdirs(); snapshot.bytes = backend.bytes
            }
        }
    }
}

// Explicit GPU tests, using the production terrain code in hidden GL contexts and FBOs only.
['4.3', '4.4', '4.5', '4.6'].each { api ->
    tasks.register('smokeGl' + api.replace('.', ''), JavaExec) {
        dependsOn tasks.named('compileSmokeJava'), tasks.named('processResources')
        classpath = sourceSets.smoke.runtimeClasspath
        mainClass = 'github.com.gengyoubo.vulkanforge.client.GlOffscreenSmoke'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        systemProperty 'log4j.configurationFile', file('src/smoke/resources/offscreen-log4j2.xml').absolutePath
        args api
    }
}
tasks.register('offscreenBenchmarkArgs') {
    dependsOn 'compileSmokeJava', 'processResources', ':vulkan-lab:exportBenchmarkScene', ':vulkan-lab:traceArgs'
    doLast {
        def destination = file('build/reports/offscreen-performance/gl.args')
        destination.parentFile.mkdirs()
        destination.text = '-cp "' + sourceSets.smoke.runtimeClasspath.asPath.replace(File.separator, '/') + '"\n' +
                '-Dlog4j.configurationFile="' + file('src/smoke/resources/offscreen-log4j2.xml').toURI().toString() + '"\n'
    }
}
tasks.register('smokeGlOffscreen') { dependsOn 'smokeGl43', 'smokeGl44', 'smokeGl45', 'smokeGl46' }
if (project.hasProperty('tailAblation')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        doLast {
            def output = rootProject.file(project.findProperty('tailBench.output') ?: 'build/reports/tail-game-ablation')
            if (!new File(output, 'status.txt').exists() || new File(output, 'status.txt').text.trim() != 'OK'
                    || new File(output, 'exit-timeout.txt').exists()) throw new GradleException('Tail ablation failed; see ' + output)
            new File(output, 'backend.txt').bytes = file('run/logs/vulkanforge/main-window-report.txt').bytes
            new File(output, 'presentation.txt').bytes = file('run/logs/vulkanforge/gl-tail-report.txt').bytes
        }
    }
}
if (project.hasProperty('glTailSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def output = file('run/logs/vulkanforge/gl-tail-smoke/report.txt')
            output.parentFile.mkdirs(); output.text = 'STATUS=RUNNING\n'
        }
        doLast {
            def output = file('run/logs/vulkanforge/gl-tail-smoke/report.txt')
            def window = file('run/logs/vulkanforge/main-window-report.txt')
            def tail = file('run/logs/vulkanforge/gl-tail-report.txt')
            if (!output.exists() || !output.text.contains('STATUS=OK') || output.text.contains('EXIT_TIMEOUT')
                    || !window.exists() || !window.text.contains('HYBRID_EXECUTION_PLAN=GL_TAIL')
                    || !window.text.contains('FINAL_PRESENTED_FRAMES=0') || !window.text.contains('VALIDATION_ERRORS=0')
                    || !tail.exists() || !tail.text.contains('CLOSED=true')) {
                throw new GradleException('GL tail smoke failed or did not close; see run/logs/vulkanforge/gl-tail-smoke/report.txt')
            }
            new File(output.parentFile, 'backend.txt').bytes = window.bytes
            new File(output.parentFile, 'presentation.txt').bytes = tail.bytes
        }
    }
}
tasks.register('smokePostChainTransform', JavaExec) {
    dependsOn 'compileSmokeJava', 'processResources'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.client.PostChainTransformSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    systemProperty 'log4j.configurationFile', file('src/smoke/resources/offscreen-log4j2.xml').toURI().toString()
}
tasks.register('smokeTailDiagnosticsTransform', JavaExec) {
    dependsOn 'compileSmokeJava', 'processResources'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.client.TailDiagnosticsTransformSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
// Sampling disabled / every frame / every 60 frames, with actual GPU pixels and foreign-state restoration checks.
['60', '1', '0'].each { interval ->
    tasks.register('smokeTerrainTuning' + interval, JavaExec) {
        dependsOn 'compileSmokeJava', 'processResources'
        classpath = sourceSets.smoke.runtimeClasspath
        mainClass = 'github.com.gengyoubo.vulkanforge.client.GlTerrainOptimizationSmoke'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        systemProperty 'log4j.configurationFile', file('src/smoke/resources/offscreen-log4j2.xml').toURI().toString()
        systemProperty 'vulkanforge.gl46.counterInterval', interval
        systemProperty 'vulkanforge.gl46.diffState', 'true'
        systemProperty 'bench.output', file('build/reports/terrain-opt-smoke/interval-' + interval).absolutePath
    }
}
tasks.register('smokeTerrainTuning') { dependsOn 'smokeTerrainTuning60', 'smokeTerrainTuning1', 'smokeTerrainTuning0' }
tasks.register('smokeEntityBatchBoundary', JavaExec) {
    dependsOn 'compileSmokeJava', 'processResources'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.client.GlEntityBatchBoundarySmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    systemProperty 'log4j.configurationFile', file('src/smoke/resources/offscreen-log4j2.xml').toURI().toString()
}
['4.3', '4.4', '4.5', '4.6'].each { api ->
    tasks.register('benchmarkGl' + api.replace('.', ''), JavaExec) {
        dependsOn tasks.named('compileSmokeJava'), tasks.named('processResources'), ':vulkan-lab:exportBenchmarkScene'
        classpath = sourceSets.smoke.runtimeClasspath
        mainClass = 'github.com.gengyoubo.vulkanforge.client.GlOffscreenBenchmark'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        systemProperty 'log4j.configurationFile', file('src/smoke/resources/offscreen-log4j2.xml').absolutePath
        rootProject.properties.findAll { it.key.startsWith('bench.') }.each { systemProperty it.key, it.value }
        args api, file('build/reports/offscreen-performance/scene.bin').absolutePath
    }
}
tasks.register('smokeOffscreenVersions') {
    dependsOn 'smokeGlOffscreen', ':vulkan-lab:smokeVulkanOffscreen'
    doLast {
        def reports = file('build/reports/offscreen-versions')
        def lines = ['# Offscreen version checks', '', '| API | Result | Evidence |', '| --- | --- | --- |']
        ['4.3', '4.4', '4.5', '4.6'].each { api ->
            def report = new File(reports, 'gl-' + api + '/report.txt')
            if (!report.text.contains('STATUS=OK')) throw new GradleException('Missing OpenGL ' + api + ' success report')
            lines.add('| OpenGL ' + api + ' | PASS | [FBO pixels and GL errors](gl-' + api + '/report.txt) |')
        }
        ['1.2', '1.3', '1.4'].each { api ->
            ['world', 'bridge', 'resources', 'shared'].each { check ->
                if (!new File(reports, 'vk-' + api + '/' + check + '-result.txt').text.contains('STATUS=OK'))
                    throw new GradleException('Missing Vulkan ' + api + ' ' + check + ' success report')
            }
            lines.add('| Vulkan ' + api + ' | PASS | [World](vk-' + api + '/world-result.txt), [bridge](vk-' + api + '/bridge-result.txt), [resources](vk-' + api + '/resources-result.txt), [shared images](vk-' + api + '/shared-result.txt) |')
        }
        lines.addAll(['', 'No visible windows, SwapBuffers or presentation. Diagnostic pixel readback is used to verify offscreen images.',
                'See each Vulkan log for VALIDATION=ENABLED or UNAVAILABLE; zero errors with an unavailable layer is not a validation-layer pass.', '',
                'Reproduce: `gradlew.bat smokeOffscreenVersions`'])
        new File(reports, 'summary.md').text = lines.join('\n') + '\n'
    }
}

if (project.hasProperty('gl46Smoke') || project.hasProperty('gl46Move')) {
    def gl46Report = project.hasProperty('gl46Move') ? 'run/logs/vulkanforge/gl46-move/report.txt' : 'run/logs/vulkanforge/gl46-smoke/report.txt'
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def report = file(gl46Report)
            report.parentFile.mkdirs()
            report.text = 'STATUS=RUNNING\n'
        }
        doLast {
            def report = file(gl46Report)
            if (!report.exists() || !report.text.contains('STATUS=OK') || report.text.contains('EXIT_TIMEOUT')) {
                throw new GradleException('GL 4.6 smoke did not finish successfully; see ' + gl46Report)
            }
        }
    }
}
if (project.hasProperty('worldSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def report = file('run/logs/vulkanforge/world-client-smoke/report.txt')
            report.parentFile.mkdirs()
            report.text = 'STATUS=RUNNING\n'
        }
        doLast {
            def report = file('run/logs/vulkanforge/world-client-smoke/report.txt')
            if (!report.exists() || !report.text.contains('STATUS=OK') || report.text.contains('EXIT_TIMEOUT')) {
                throw new GradleException('World client smoke did not finish successfully; see run/logs/vulkanforge/world-client-smoke/report.txt')
            }
            // The backend writes these only after swapchain, shared images, device and instance are destroyed.
            def window = file('run/logs/vulkanforge/main-window-report.txt')
            if (report.text.contains('PASS ASM hooks') && (!window.exists() || !window.text.contains('FINAL_PRESENTED_FRAMES=') || !window.text.contains('VALIDATION_ERRORS=0'))) {
                throw new GradleException('Vulkan main window did not shut down cleanly; see run/logs/vulkanforge/main-window-report.txt')
            }
            if (project.hasProperty('validationSmoke')) {
                if (!window.text.contains('VALIDATION=ENABLED')) throw new GradleException('Vulkan validation layer was not enabled')
                if (report.text.contains('PASS same-process WorldScene')) {
                    if (!window.text.contains('WORLD_BACKEND=MAIN_WINDOW_SHARED_GPU') || !window.text.contains('WORLD_RGBA_READBACK_BYTES=0')
                            || !window.text.contains('WORLD_FINAL_FRAMES=') || !window.text.contains('GPU_TERRAIN_MS samples=')) {
                        throw new GradleException('Shared terrain did not finish rendering and releasing its resources')
                    }
                } else {
                    def bridge = file('run/logs/vulkanforge/bridge-report.txt')
                    if (!bridge.exists() || !bridge.text.contains('VALIDATION=ENABLED') || !bridge.text.contains('VALIDATION_ERRORS=0')) {
                        throw new GradleException('Terrain bridge did not pass validation')
                    }
                }
            }
        }
    }
}
