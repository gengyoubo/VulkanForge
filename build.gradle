if (project.hasProperty('tailAblation')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        doLast {
            def output = rootProject.file(project.findProperty('tailBench.output') ?: 'build/reports/tail-game-ablation')
            if (!new File(output, 'status.txt').exists() || new File(output, 'status.txt').text.trim() != 'OK'
                    || new File(output, 'exit-timeout.txt').exists()) throw new GradleException('Tail ablation failed; see ' + output)
            new File(output, 'backend.txt').bytes = file('run/logs/vulkanforge/main-window-report.txt').bytes
            new File(output, 'presentation.txt').bytes = file('run/logs/vulkanforge/gl-tail-report.txt').bytes
        }
    }
}
if (project.hasProperty('glTailSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def output = file('run/logs/vulkanforge/gl-tail-smoke/report.txt')
            output.parentFile.mkdirs(); output.text = 'STATUS=RUNNING\n'
        }
        doLast {
            def output = file('run/logs/vulkanforge/gl-tail-smoke/report.txt')
            def window = file('run/logs/vulkanforge/main-window-report.txt')
            def tail = file('run/logs/vulkanforge/gl-tail-report.txt')
            if (!output.exists() || !output.text.contains('STATUS=OK') || output.text.contains('EXIT_TIMEOUT')
                    || !window.exists() || !window.text.contains('HYBRID_EXECUTION_PLAN=GL_TAIL')
                    || !window.text.contains('FINAL_PRESENTED_FRAMES=0') || !window.text.contains('VALIDATION_ERRORS=0')
                    || !tail.exists() || !tail.text.contains('CLOSED=true')) {
                throw new GradleException('GL tail smoke failed or did not close; see run/logs/vulkanforge/gl-tail-smoke/report.txt')
            }
            new File(output.parentFile, 'backend.txt').bytes = window.bytes
            new File(output.parentFile, 'presentation.txt').bytes = tail.bytes
        }
    }
}
