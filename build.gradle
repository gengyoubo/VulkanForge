tasks.register('smokeOffscreenVersions') {
    dependsOn 'smokeGlOffscreen', ':vulkan-lab:smokeVulkanOffscreen'
    doLast {
        def reports = file('build/reports/offscreen-versions')
        def lines = ['# Offscreen version checks', '', '| API | Result | Evidence |', '| --- | --- | --- |']
        ['4.3', '4.4', '4.5', '4.6'].each { api ->
            def report = new File(reports, 'gl-' + api + '/report.txt')
            if (!report.text.contains('STATUS=OK')) throw new GradleException('Missing OpenGL ' + api + ' success report')
            lines.add('| OpenGL ' + api + ' | PASS | [FBO pixels and GL errors](gl-' + api + '/report.txt) |')
        }
        ['1.2', '1.3', '1.4'].each { api ->
            ['world', 'bridge', 'resources', 'shared'].each { check ->
                if (!new File(reports, 'vk-' + api + '/' + check + '-result.txt').text.contains('STATUS=OK'))
                    throw new GradleException('Missing Vulkan ' + api + ' ' + check + ' success report')
            }
            lines.add('| Vulkan ' + api + ' | PASS | [World](vk-' + api + '/world-result.txt), [bridge](vk-' + api + '/bridge-result.txt), [resources](vk-' + api + '/resources-result.txt), [shared images](vk-' + api + '/shared-result.txt) |')
        }
        lines.addAll(['', 'No visible windows, SwapBuffers or presentation. Diagnostic pixel readback is used to verify offscreen images.',
                'See each Vulkan log for VALIDATION=ENABLED or UNAVAILABLE; zero errors with an unavailable layer is not a validation-layer pass.', '',
                'Reproduce: `gradlew.bat smokeOffscreenVersions`'])
        new File(reports, 'summary.md').text = lines.join('\n') + '\n'
    }
}

if (project.hasProperty('gl46Smoke') || project.hasProperty('gl46Move')) {
    def gl46Directory = project.hasProperty('isolatedGl46') ? 'run-gl46' : 'run'
    def gl46Report = gl46Directory + '/logs/vulkanforge/' + (project.hasProperty('gl46Move') ? 'gl46-move/report.txt' : 'gl46-smoke/report.txt')
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            if (project.hasProperty('isolatedGl46')) {
                def options = file(gl46Directory + '/options.txt')
                options.parentFile.mkdirs()
                if (!options.exists()) options.text = 'renderDistance:4\nsimulationDistance:5\nguiScale:2\nmaxFps:260\nenableVsync:false\nonboardAccessibility:false\n'
            }
            def report = file(gl46Report)
            report.parentFile.mkdirs()
            report.text = 'STATUS=RUNNING\n'
        }
        doLast {
            def report = file(gl46Report)
            if (!report.exists() || !report.text.contains('STATUS=OK') || report.text.contains('EXIT_TIMEOUT')) {
                throw new GradleException('GL 4.6 smoke did not finish successfully; see ' + gl46Report)
            }
        }
    }
}
if (project.hasProperty('worldSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def report = file('run/logs/vulkanforge/world-client-smoke/report.txt')
            report.parentFile.mkdirs()
            report.text = 'STATUS=RUNNING\n'
        }
        doLast {
            def report = file('run/logs/vulkanforge/world-client-smoke/report.txt')
            if (!report.exists() || !report.text.contains('STATUS=OK') || report.text.contains('EXIT_TIMEOUT')) {
                throw new GradleException('World client smoke did not finish successfully; see run/logs/vulkanforge/world-client-smoke/report.txt')
            }
            // The backend writes these only after swapchain, shared images, device and instance are destroyed.
            def window = file('run/logs/vulkanforge/main-window-report.txt')
            if (report.text.contains('PASS ASM hooks') && (!window.exists() || !window.text.contains('FINAL_PRESENTED_FRAMES=') || !window.text.contains('VALIDATION_ERRORS=0'))) {
                throw new GradleException('Vulkan main window did not shut down cleanly; see run/logs/vulkanforge/main-window-report.txt')
            }
            if (project.hasProperty('validationSmoke')) {
                if (!window.text.contains('VALIDATION=ENABLED')) throw new GradleException('Vulkan validation layer was not enabled')
                if (report.text.contains('PASS same-process WorldScene')) {
                    if (!window.text.contains('WORLD_BACKEND=MAIN_WINDOW_SHARED_GPU') || !window.text.contains('WORLD_RGBA_READBACK_BYTES=0')
                            || !window.text.contains('WORLD_FINAL_FRAMES=') || !window.text.contains('GPU_TERRAIN_MS samples=')) {
                        throw new GradleException('Shared terrain did not finish rendering and releasing its resources')
                    }
                } else {
                    def bridge = file('run/logs/vulkanforge/bridge-report.txt')
                    if (!bridge.exists() || !bridge.text.contains('VALIDATION=ENABLED') || !bridge.text.contains('VALIDATION_ERRORS=0')) {
                        throw new GradleException('Terrain bridge did not pass validation')
                    }
                }
            }
        }
    }
}
