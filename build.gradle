plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main.java.srcDir 'bridge-protocol/src/main/java'
sourceSets.main.java.srcDir 'gl-interop/src/main/java'
sourceSets.main.java.srcDir 'shader-pack/src/main/java'
sourceSets {
    shaderPackTest {
        java.srcDir 'shader-pack/src/test/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    nativeBootstrap { }
    nativeBootstrapTest {
        compileClasspath += sourceSets.nativeBootstrap.output + sourceSets.nativeBootstrap.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    smoke {
        java.srcDir 'benchmark-support/src/main/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { vulkanforge { source sourceSets.main } }
        }
        client {
            // Dependency refmaps use SRG names; the ForgeGradle client uses official mapped names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            // The agent reads the saved mode before Forge; it stays inert for GL/GL_VK.
            if (!project.hasProperty('nativeBootstrapRelaunch'))
                jvmArg '-javaagent:' + project.file('build/libs/vulkanforge-native-bootstrap.jar').absolutePath
            if (!project.hasProperty('nativeGame') && System.getProperty('vulkanforge.startup') != null)
                property 'vulkanforge.startup', System.getProperty('vulkanforge.startup')
            if (project.hasProperty('nativeGame')) {
                workingDirectory project.file('run-native')
                property 'vulkanforge.startup', 'VK:' + (project.findProperty('nativeApi') ?: 'V1_4')
            }
            if (project.hasProperty('nativeGameSmoke')) {
                property 'vulkanforge.nativeGameSmoke', 'true'
                if (project.hasProperty('nativeSmokeHidden')) property 'vulkanforge.nativeSmokeHidden', 'true'
                if (project.hasProperty('nativeMenuOnly')) property 'vulkanforge.nativeMenuOnly', 'true'
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if (project.hasProperty('shaderPackSmoke')) {
                def shaderMode=project.findProperty('shaderPackMode') ?: 'VK'
                workingDirectory project.file('run-shaders/' + shaderMode)
                property 'vulkanforge.startup', shaderMode=='VK' ? 'VK:V1_4' : 'GL:DEFAULT'
                property 'vulkanforge.shaderPackSmoke', shaderMode
                property 'shaderPack.output', project.file(project.findProperty('shaderPack.output') ?: 'build/reports/shader-packs/' + shaderMode).absolutePath
                if(project.hasProperty('shaderPack.reference'))property 'shaderPack.reference',project.file(project.property('shaderPack.reference')).absolutePath
                if(project.hasProperty('shaderPack.unsupported'))property 'shaderPack.unsupported',project.file(project.property('shaderPack.unsupported')).absolutePath
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if(project.hasProperty('ownPackSmoke')){
                def mode=project.findProperty('ownPackMode') ?: 'VK'
                workingDirectory project.file('run-own-pack/'+mode)
                property 'vulkanforge.startup',mode=='VK'?'VK:V1_4':'GL:DEFAULT'
                property 'vulkanforge.ownPackSmoke',mode
                property 'vulkanforge.shaderPackProfile','true'
                property 'ownPack.pack',project.findProperty('ownPackFile') ?: 'ComplementaryReimagined_r5.9.3.zip'
                property 'ownPack.options',project.findProperty('ownPackOptions') ?: ''
                if(project.hasProperty('ownPackStages'))property 'ownPack.stages','true'
                property 'ownPack.output',project.file(project.findProperty('ownPack.output') ?: 'build/reports/own-pack/'+mode).absolutePath
                property 'vulkanforge.shaderFailureDirectory',project.file('build/reports/own-pack/'+mode+'/failed-shaders').absolutePath
                mods {vulkanforge {source sourceSets.smoke}}
            }
            if(project.hasProperty('oculusSmoke')){
                def mode=project.findProperty('oculusMode') ?: 'VK'
                workingDirectory project.file('run-oculus/'+mode)
                property 'vulkanforge.startup',mode=='VK'?'VK:V1_4':'GL:DEFAULT'
                property 'vulkanforge.oculusSmoke',mode
                property 'oculusSmoke.output',project.file('build/reports/oculus/'+mode).absolutePath
                property 'vulkanforge.shaderFailureDirectory',project.file('build/reports/oculus/'+mode+'/failed-shaders').absolutePath
                property 'vulkanforge.shaderCacheDirectory',project.file('build/cache/native-shaders').absolutePath
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if (project.hasProperty('gameFps')) {
                def fpsMode = project.findProperty('fpsMode') ?: 'VK'
                if (!(fpsMode in ['VK', 'GL', 'GL46'])) throw new GradleException('fpsMode must be VK, GL or GL46')
                workingDirectory project.file('run-fps/' + fpsMode)
                property 'vulkanforge.startup', fpsMode == 'VK' ? 'VK:V1_4' : fpsMode == 'GL46' ? 'GL:GL_4_6' : 'GL:DEFAULT'
                property 'vulkanforge.gameFps', fpsMode
                property 'fps.output', project.file(project.findProperty('fps.output') ?: 'build/reports/game-fps/' + fpsMode).absolutePath
                ['seconds','warmup','rounds','width','height','distance','cows','items','entityLimit','updates','hudCases','survivalHud'].each { option ->
                    if (project.hasProperty('fps.' + option)) property 'fps.' + option, project.property('fps.' + option)
                }
                property 'vulkanforge.gl46.profileGpu', 'false'
                property 'vulkanforge.gl46.verifyState', 'false'
                property 'vulkanforge.disableValidation', 'true'
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if (project.hasProperty('nativeDiagnostics') || project.hasProperty('nativeProfile')) property 'vulkanforge.nativeDiagnostics', 'true'
            if (project.hasProperty('nativeProfile')) property 'vulkanforge.nativeProfile', 'true'
            if(project.hasProperty('hudAblation')){property 'vulkanforge.hudDiagnostics','true';property 'fps.hudCases',project.findProperty('fps.hudCases') ?: 'BASELINE,NO_HANDS,NO_HOTBAR,NO_HEALTH,NO_HUD,F1,NO_HANDS_HUD'}
            if(project.hasProperty('guiFastCompare')){property 'vulkanforge.nativeGuiFastPath','true';property 'fps.guiCompare','true'}
            if(project.hasProperty('hotbarCacheCompare')){property 'vulkanforge.nativeGuiFastPath','true';property 'vulkanforge.nativeHotbarCache','true';property 'fps.hotbarCompare','true'}
            if (project.hasProperty('nativeLegacyModSubmission')) property 'vulkanforge.nativeLegacyModSubmission', 'true'
            ['nativeModSubmission','nativeRegionBridge','nativeDynamicBatching','nativeChlorideTopK','nativeGuiFastPath','nativeHotbarCache'].each { option ->
                if(project.hasProperty(option)) property 'vulkanforge.'+option,'true'
            }
            ['vulkanforge.entityProfile', 'vulkanforge.entityLegacyBatch', 'vulkanforge.noInteropOptimizations', 'vulkanforge.earlyGlInputFlush', 'vulkanforge.glTailCompatibility'].each { key ->
                if (System.getProperty(key) != null) property key, System.getProperty(key)
            }
            ['tailProfile','tailProfileCpuOnly','glTailDiagnostics','glTailCase','interopProfile'].each { option ->
                def key = 'vulkanforge.' + option
                if (System.getProperty(key) != null) property key, System.getProperty(key)
            }
            if (project.hasProperty('tailAblation')) {
                property 'vulkanforge.tailAblation', 'true'
                if (!project.hasProperty('glTailFromConfig')) property 'vulkanforge.glTailCompatibility', 'true'
                property 'vulkanforge.glTailDiagnostics', 'true'
                property 'vulkanforge.tailProfile', 'true'
                property 'vulkanforge.interopProfile', 'true'
                if (!project.hasProperty('glTailFromConfig')) property 'vulkanforge.startup', 'GL_VK:V1_4'
                ['rounds','seconds','warmup','cases','phases'].each { option ->
                    def key = 'tailBench.' + option
                    if (project.hasProperty(key)) property key, project.property(key)
                }
                property 'tailBench.output', rootProject.file(project.findProperty('tailBench.output') ?: 'build/reports/tail-game-ablation').absolutePath
                property 'vulkanforge.tailProfileCpuOnly', project.findProperty('tailBench.cpuOnly') ?: 'false'
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if (project.hasProperty('vulkan13Smoke')) property 'vulkanforge.startup', 'VULKAN:V1_3'
            property 'vulkanforge.directPresent', System.getProperty('vulkanforge.directPresent', 'true')
            property 'vulkanforge.legacyPresent', System.getProperty('vulkanforge.legacyPresent', 'false')
            ['counterInterval', 'skipEmptyLayers', 'diffState', 'profileGpu', 'profileInterval'].each { option ->
                def key = 'vulkanforge.gl46.' + option
                if (System.getProperty(key) != null) property key, System.getProperty(key)
            }
            if (project.hasProperty('validationSmoke')) property 'vulkanforge.requireValidation', 'true'
            if (project.hasProperty('pushDescriptorSmoke')) property 'vulkanforge.preferPushDescriptors', 'true'
            if (project.hasProperty('configSmoke')) {
                property 'vulkanforge.configSmoke', 'true'
                if (project.hasProperty('restartClientSmoke')) property 'vulkanforge.restartClientSmoke', 'true'
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if (project.hasProperty('worldSmoke')) {
                property 'vulkanforge.worldSmoke', 'true'
                // This regression specifically checks the original Vulkan swapchain execution plan.
                property 'vulkanforge.glTailCompatibility', 'false'
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if (project.hasProperty('glTailSmoke')) {
                property 'vulkanforge.glTailSmoke', 'true'
                if (!project.hasProperty('glTailFromConfig')) {
                    property 'vulkanforge.glTailCompatibility', 'true'
                    property 'vulkanforge.startup', 'GL_VK:V1_4'
                }
                mods { vulkanforge { source sourceSets.smoke } }
            }
            if (project.hasProperty('glTailFromConfig')) property 'vulkanforge.glTailFromConfig', 'true'
            if (project.hasProperty('gl46Smoke') || project.hasProperty('gl46Move')) {
                if (project.hasProperty('isolatedGl46')) workingDirectory project.file('run-gl46')
                // -Pgl46Smoke: feature/parity check in a flat world; -Pgl46Move: fast flight through a generated world.
                property(project.hasProperty('gl46Move') ? 'vulkanforge.gl46Move' : 'vulkanforge.gl46Smoke', 'true')
                property 'vulkanforge.startup', 'OPENGL:GL_4_6'
                // -Pgl46Verify: compare every cached GL state snapshot with glGet (correctness run; timings are not representative).
                if (project.hasProperty('gl46Verify')) property 'vulkanforge.gl46.verifyState', 'true'
                // -Pgl46Flags=glsl,noHiZ,noBlockEntityCache,noVanillaVisibility,noEntities: A/B switches (vulkanforge.gl46.<flag>=true).
                if (project.hasProperty('gl46Flags')) project.property('gl46Flags').toString().split(',').each { if (it.trim()) property "vulkanforge.gl46.${it.trim()}", 'true' }
                mods { vulkanforge { source sourceSets.smoke } }
            }
        }
        server { args '--nogui' }
    }
}
repositories {
    // Optional local download cache; clean checkouts resolve the same unmodified artifact from Modrinth.
    maven { url layout.buildDirectory.dir('dependency-cache/maven'); content { includeGroup 'maven.modrinth' } }
    maven { url 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven {
        url "https://cursemaven.com"
    }
}
configurations { shaderRuntimeMods { transitive=false } }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    if (!project.hasProperty('withoutEmbeddium')) implementation fg.deobf("curse.maven:embeddium-908741:5681725")
    // Reference implementation is never part of the production loader/runtime bundle.
    if(project.hasProperty('irisReference')||project.hasProperty('oculusSmoke'))implementation fg.deobf('maven.modrinth:oculus:1.20.1-1.8.0')
    implementation fg.deobf("curse.maven:chloride-931925:8462759")
    implementation fg.deobf("curse.maven:magnesium-extras-558905:6041697")
    implementation fg.deobf("curse.maven:flerovium-1142875:8284677")
    nativeBootstrapImplementation 'org.ow2.asm:asm-tree:9.5'
    shaderRuntimeMods 'curse.maven:embeddium-908741:5681725'
}

tasks.register('shaderRuntimeBundle',Zip){
    dependsOn 'build','nativeBootstrapJar'
    archiveFileName='vulkanforge-shader-runtime.zip'
    destinationDirectory=layout.buildDirectory.dir('distributions')
    from(tasks.named('jar')){into 'mods'}
    from(configurations.shaderRuntimeMods){into 'mods'}
    from(tasks.named('nativeBootstrapJar')){into 'bootstrap'}
    from('docs/shader-runtime-install.md'){rename { 'README.md' }}
}

tasks.register('nativeBootstrapJar', Jar) {
    dependsOn 'nativeBootstrapClasses'
    archiveFileName = 'vulkanforge-native-bootstrap.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.nativeBootstrap.output
    from { configurations.nativeBootstrapRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    manifest { attributes 'Premain-Class': 'dev.vulkanforge.bootstrap.NativeBootstrap' }
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
}
tasks.register('smokeNativeBootstrap', JavaExec) {
    dependsOn 'nativeBootstrapTestClasses'
    classpath = sourceSets.nativeBootstrapTest.runtimeClasspath
    mainClass = 'dev.vulkanforge.bootstrap.NativeBootstrapSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.register('auditIrisGl',JavaExec){
    dependsOn 'nativeBootstrapTestClasses'
    classpath=sourceSets.nativeBootstrapTest.runtimeClasspath
    mainClass='dev.vulkanforge.bootstrap.IrisGlAudit'
    args file('build/reference-mods/maven/dev/vulkanforge/test/oculus/1.8.0/oculus-1.8.0.jar').absolutePath,file('src/main/java/github/com/gengyoubo/vulkanforge/client/NativeDeviceState.java').absolutePath,file('build/iris-gl-audit.txt').absolutePath
}

tasks.register('smokeNativeBuffers', JavaExec) {
    dependsOn 'smokeClasses'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.client.NativeBuffersSmoke'
    systemProperty 'vulkanforge.nativeBootstrap', 'true'
}

tasks.register('smokeShaderPack', JavaExec) {
    dependsOn 'shaderPackTestClasses'
    classpath = sourceSets.shaderPackTest.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.shaderpack.ShaderPackSmoke'
}
tasks.register('smokeShaderPackUniformInputs',JavaExec){
    dependsOn 'smokeClasses'
    classpath=sourceSets.smoke.runtimeClasspath
    mainClass='github.com.gengyoubo.vulkanforge.client.shader.ShaderPackUniformInputSmoke'
    args file('run/shaderpacks/ComplementaryReimagined_r5.9.3.zip').absolutePath
    if(file('run/shaderpacks/MakeUp-UltraFast-9.6.zip').isFile())args file('run/shaderpacks/MakeUp-UltraFast-9.6.zip').absolutePath
    javaLauncher=javaToolchains.launcherFor {languageVersion=JavaLanguageVersion.of(17)}
}
tasks.register('smokeOwnLoader', JavaExec) {
    dependsOn 'shaderPackTestClasses'
    classpath = sourceSets.shaderPackTest.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.shaderpack.OwnLoaderSmoke'
    // Optional real pack; without one only the bundled expression fixtures run.
    def input=project.file(project.findProperty('shaderPack.input') ?: 'run/shaderpacks/ComplementaryReimagined_r5.9.3.zip')
    if(input.exists())args input.absolutePath
}
tasks.register('inspectShaderPack', JavaExec) {
    dependsOn 'shaderPackTestClasses'
    classpath = sourceSets.shaderPackTest.runtimeClasspath
    mainClass = 'github.com.gengyoubo.vulkanforge.shaderpack.ShaderPackInspect'
    doFirst {if(!project.hasProperty('shaderPack.inspect'))throw new GradleException('Set -PshaderPack.inspect=<ZIP or folder>');args project.file(project.property('shaderPack.inspect')).absolutePath}
}
tasks.named('assemble') { dependsOn 'nativeBootstrapJar' }
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'nativeBootstrapJar' }
if(project.hasProperty('ownPackSmoke'))tasks.matching{it.name=='runClient'}.configureEach{
    def mode=project.findProperty('ownPackMode') ?: 'VK'
    def output=file(project.findProperty('ownPack.output') ?: 'build/reports/own-pack/'+mode)
    doFirst{
        def directory=file('run-own-pack/'+mode);new File(directory,'shaderpacks').mkdirs();new File(directory,'config').mkdirs();output.mkdirs()
        new File(directory,'config/vulkanforge-shaders.properties').text='selected=\n'
        def pack=file('run/shaderpacks/'+(project.findProperty('ownPackFile') ?: 'ComplementaryReimagined_r5.9.3.zip'));new File(directory,'shaderpacks/'+pack.name).bytes=pack.bytes
        new File(directory,'options.txt').text='renderDistance:3\nsimulationDistance:5\nguiScale:2\nmaxFps:60\nenableVsync:false\nonboardAccessibility:false\nlang:en_us\n'
        new File(output,'result.txt').text='STATUS=RUNNING\n'
    }
    doLast{
        if(!new File(output,'result.txt').text.contains('STATUS=OK'))throw new GradleException('VulkanForge own pack test failed: '+output)
    }
}
if (project.hasProperty('gameFps')) tasks.matching { it.name == 'runClient' }.configureEach {
    def fpsMode = project.findProperty('fpsMode') ?: 'VK'
    def output = project.file(project.findProperty('fps.output') ?: 'build/reports/game-fps/' + fpsMode)
    doFirst {
        def game = project.file('run-fps/' + fpsMode); game.mkdirs()
        new File(game, 'options.txt').text = 'renderDistance:8\nsimulationDistance:5\nguiScale:2\nmaxFps:260\nenableVsync:false\nfullscreen:false\nonboardAccessibility:false\nmipmapLevels:0\n'
        output.mkdirs(); new File(output, 'status.txt').text = 'RUNNING\n'
    }
    doLast {
        if (new File(output, 'status.txt').text.trim() != 'OK') throw new GradleException('FPS measurement failed: ' + output)
        def backend = new File(project.file('run-fps/' + fpsMode), 'logs/vulkanforge/' + (fpsMode == 'VK' ? 'native-game-report.txt' : 'gl46-report.txt'))
        if (backend.exists()) new File(output, 'backend.txt').bytes = backend.bytes
        if (fpsMode == 'VK' && (!backend.exists() || !backend.text.contains('CLOSED=true'))) throw new GradleException('Native FPS backend did not close cleanly')
    }
}
if(project.hasProperty('shaderPackSmoke')) tasks.matching { it.name=='runClient' }.configureEach {
    def shaderMode=project.findProperty('shaderPackMode') ?: 'VK'
    def reports=project.file(project.findProperty('shaderPack.output') ?: 'build/reports/shader-packs/' + shaderMode)
    doFirst {
        def directory=project.file('run-shaders/' + shaderMode);directory.mkdirs();new File(directory,'options.txt').text='renderDistance:3\nsimulationDistance:5\nguiScale:4\nmaxFps:60\nenableVsync:false\nfullscreen:false\nonboardAccessibility:false\nlang:zh_cn\ntutorialStep:none\n'
        reports.mkdirs();new File(reports,'result.txt').text='STATUS=RUNNING\n'
    }
    doLast {
        if(!new File(reports,'result.txt').text.contains('STATUS=OK'))throw new GradleException('Shader pack smoke failed: ' + reports)
        if(shaderMode=='VK'){
            def backend=new File(project.file('run-shaders/VK'),'logs/vulkanforge/native-game-report.txt');new File(reports,'backend.txt').bytes=backend.bytes
            if(!backend.text.contains('CLOSED=true')||!backend.text.contains('VALIDATION_ERRORS=0'))throw new GradleException('Shader pack backend did not close cleanly')
        }
    }
}
if(project.hasProperty('oculusSmoke'))tasks.matching {it.name=='runClient'}.configureEach{
    def mode=project.findProperty('oculusMode') ?: 'VK'
    def output=project.file('build/reports/oculus/'+mode)
    doFirst{
        if(project.hasProperty('withoutOculus'))throw new GradleException('oculusSmoke requires the Oculus frontend')
        def directory=project.file('run-oculus/'+mode);directory.mkdirs();new File(directory,'config').mkdirs();new File(directory,'shaderpacks').mkdirs()
        def pack=project.file('run/shaderpacks/ComplementaryReimagined_r5.9.3.zip');if(!pack.isFile())throw new GradleException('Missing original Complementary ZIP')
        new File(directory,'shaderpacks/'+pack.name).bytes=pack.bytes
        new File(directory,'config/oculus.properties').text='enableShaders=true\nshaderPack='+pack.name+'\ncolorSpace=SRGB\nenableDebugOptions=false\ndisableUpdateMessage=true\n'
        new File(directory,'options.txt').text='renderDistance:4\nsimulationDistance:5\nguiScale:2\nmaxFps:60\nenableVsync:false\nfullscreen:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\n'
        output.mkdirs();new File(output,'result.txt').text='STATUS=RUNNING\n'
    }
    doLast{
        if(!new File(output,'result.txt').text.contains('STATUS=OK'))throw new GradleException('Full shader pack game smoke failed: '+output)
        if(mode=='VK'){
            def backend=new File(project.file('run-oculus/VK'),'logs/vulkanforge/native-game-report.txt');new File(output,'backend.txt').bytes=backend.bytes
            if(!backend.text.contains('CLOSED=true')||!backend.text.contains('VALIDATION_ERRORS=0'))throw new GradleException('Full pack Vulkan backend did not close cleanly')
        }
    }
}
if (project.hasProperty('nativeGame') || project.hasProperty('nativeGameSmoke')) tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'nativeBootstrapJar'
    doFirst {
        def directory=file(project.hasProperty('nativeGame') ? 'run-native' : 'run'); directory.mkdirs()
        if (project.hasProperty('nativeGameSmoke')) {
            if (project.hasProperty('nativeGame')) new File(directory,'options.txt').text='renderDistance:3\nsimulationDistance:5\nguiScale:2\nmaxFps:60\nenableVsync:false\nonboardAccessibility:false\n'
            def result=new File(directory,'logs/vulkanforge/native-game-smoke/result.txt');result.parentFile.mkdirs();result.text='STATUS=RUNNING\n'
        }
    }
    doLast {
        if (project.hasProperty('nativeGameSmoke')) {
            def directory=file(project.hasProperty('nativeGame') ? 'run-native' : 'run')
            def result=new File(directory,'logs/vulkanforge/native-game-smoke/result.txt')
            if (project.hasProperty('nativeBootstrapRelaunch')) {
                // The launcher JVM exits before the native child finishes the smoke.
                def deadline = System.nanoTime() + java.util.concurrent.TimeUnit.SECONDS.toNanos(120)
                def backendReport = new File(directory,'logs/vulkanforge/native-game-report.txt')
                while (System.nanoTime() < deadline && result.exists() && result.text.contains('STATUS=RUNNING')) Thread.sleep(100)
                while (System.nanoTime() < deadline && result.text.contains('STATUS=OK')
                        && (!backendReport.exists() || !backendReport.text.contains('CLOSED=true'))) Thread.sleep(100)
            }
            if (!result.exists() || !result.text.contains('STATUS=OK')) throw new GradleException('Native game smoke failed; see ' + directory)
            def backend=new File(directory,'logs/vulkanforge/native-game-report.txt')
            if(!backend.exists() || !backend.text.contains('CLOSED=true') || !backend.text.contains('VALIDATION_ERRORS=0')) throw new GradleException('Native backend did not finish cleanly; see ' + backend)
            if(project.hasProperty('validationSmoke') && !backend.text.contains('VALIDATION=ENABLED')) throw new GradleException('Native validation layer was not enabled')
        }
    }
}

// The lab's LWJGL and native libraries are deliberately outside Minecraft's classpath.
evaluationDependsOn(':vulkan-lab')
def labJar = project(':vulkan-lab').tasks.named('fatJar')
tasks.named('processResources', ProcessResources) {
    dependsOn labJar, 'nativeBootstrapJar'
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
    from(labJar) { into 'vulkanforge'; rename { 'vulkan-lab.jar' } }
    from(tasks.named('nativeBootstrapJar')) { into 'vulkanforge' }
    from(project(':vulkan-lab').tasks.named('glSpirv')) { into 'assets/vulkanforge/shaders/gl46' }
}
tasks.named('jar', Jar) {
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('runProbe') { dependsOn ':vulkan-lab:runProbe' }
tasks.register('runTriangle') { dependsOn ':vulkan-lab:runTriangle' }

tasks.register('restartSmoke', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
