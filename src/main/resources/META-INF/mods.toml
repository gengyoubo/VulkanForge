[[mods]]
modId="vulkanforge"
version="${version}"
displayName="VulkanForge"
authors="gengy"
displayTest="IGNORE_ALL_VERSION"
description='''Experimental Vulkan 1.3/1.4 renderer for Forge 1.20.1. On supported Windows GPUs, an ASM coremod creates the Minecraft main window without a GL context and presents through a Vulkan Surface/Swapchain using shared GPU memory and semaphores. Legacy passes use a hidden OpenGL context. F8 enables nearby solid/cutout terrain; F10 switches full view/inset, F9 opens the standalone test. Select the Vulkan version in the mod configuration and restart to apply it. Restart with -Dvulkanforge.directPresent=false for the original GL window.'''

[[dependencies.vulkanforge]]
modId="forge"
mandatory=true
versionRange="[47,48)"
ordering="NONE"
side="BOTH"

[[dependencies.vulkanforge]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"
