[[mods]]
modId="vulkanforge"
version="${version}"
displayName="VulkanForge"
authors="gengy"
displayTest="IGNORE_ALL_VERSION"
description='''Vulkan and OpenGL rendering for Forge 1.20.1. Native VK uses a NO_API window and a private Vulkan device/Swapchain with no OpenGL context; it requires the early JVM bootstrap agent. VulkanForge includes its own Iris/OptiFine-format shader-pack loader for GL and native VK. Shader-pack feature support is reported when loading a pack. GL_VK retains the hybrid compatibility renderer. Select a backend in the mod configuration and restart to apply it.'''

